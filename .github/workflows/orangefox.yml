name: Build OrangeFox for Infinix XPAD 20 Pro (X1201)

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
          - '11.0'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/infinix/X1201

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 aria2

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize OrangeFox Sync
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@github.com"
          git clone https://gitlab.com/OrangeFox/sync.git ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          BRANCH="${{ github.event.inputs.FOX_BRANCH || '12.1' }}"
          ./orangefox_sync.sh --branch $BRANCH --path $GITHUB_WORKSPACE/fox

      - name: Place Device Tree
        run: |
          mkdir -p $GITHUB_WORKSPACE/fox/device/infinix
          cp -r device/infinix/X1201 $GITHUB_WORKSPACE/fox/device/infinix/

      - name: Build OrangeFox Vendor Boot Image
        run: |
          cd $GITHUB_WORKSPACE/fox
          # Fix mkbootimg: Android 12 header v4 requires support for --ramdisk_type and --vendor_ramdisk_fragment
          mkdir -p system/tools/mkbootimg
          curl -sSL https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-19.1/mkbootimg.py > system/tools/mkbootimg/mkbootimg.py
          curl -sSL https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-19.1/unpack_bootimg.py > system/tools/mkbootimg/unpack_bootimg.py
          curl -sSL https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-19.1/repack_bootimg.py > system/tools/mkbootimg/repack_bootimg.py
          # Patch mkbootimg.py so header v4 vendor_ramdisk_fragment is parsed even if --header_version is omitted by makefile
          python3 -c 'p="system/tools/mkbootimg/mkbootimg.py"; s=open(p).read(); open(p,"w").write(s.replace("if args.vendor_boot is not None and args.header_version > 3:", "if args.vendor_boot is not None and (args.header_version > 3 or \"--vendor_ramdisk_fragment\" in extra_args):\n        if args.header_version < 4: args.header_version = 4"))'
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=X1201
          export LC_ALL="C"
          lunch twrp_X1201-eng || lunch omni_X1201-eng || lunch fox_X1201-eng
          # Fix AOSP core/Makefile rsync root/vendor conflict
          sed -i 's/--exclude=cache/--exclude=cache --exclude=vendor/g' build/make/core/Makefile
          mka vendorbootimage -j$(nproc --all)

      - name: Upload OrangeFox Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X1201-vendor_boot
          path: |
            fox/out/target/product/X1201/vendor_boot.img
            fox/out/target/product/X1201/OrangeFox-*.zip
            fox/out/target/product/X1201/ramdisk-recovery.cpio*
            fox/out/target/product/X1201/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.gz
